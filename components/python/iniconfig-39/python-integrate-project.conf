%hook-begin%
# This is the latest version with Python 3.9 support
VERSION=2.1.0

%include-2%
# The sdist is missing tests:
# https://github.com/pytest-dev/iniconfig/issues/67
# ... and building from github tarball fails

# This component is required by following bootstrapped components so it must be
# bootstrapped too.
# - pytest (test bootstrap)
PYTHON_TEST_BOOTSTRAP = yes

# iniconfig >= 2.2.0 requires Python >= 3.10
PYTHON_VERSIONS = 3.9
%hook-manifest%
# We need versioned package only, so we cannot have PYVER in the p5m file name
mv "$DISTRIBUTION-PYVER.p5m" "$DISTRIBUTION-39.p5m"
sed -i -e 's/\$(PYVER)/3.9/g' -e 's/\$(PYV)/39/g' "$DISTRIBUTION-39.p5m"
MANIFEST="$DISTRIBUTION-39.p5m"
