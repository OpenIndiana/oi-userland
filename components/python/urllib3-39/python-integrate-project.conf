%patch% 01-test-skip-memory.patch
%patch% 02-test-skip-failing.patch

%hook-begin%
# This is the latest version with Python 3.9 support
VERSION=2.6.3

%include-2%
# urllib3 >= 2.7.0 requires Python >= 3.10
PYTHON_VERSIONS = 3.9

# Testing needs modified version of hypercorn.  We do not have that packaged.
# https://github.com/urllib3/urllib3/issues/3334
TEST_STYLE = none
%hook-manifest%
# We need versioned package only, so we cannot have PYVER in the p5m file name
mv "$DISTRIBUTION-PYVER.p5m" "$DISTRIBUTION-39.p5m"
sed -i -e 's/\$(PYVER)/3.9/g' -e 's/\$(PYV)/39/g' "$DISTRIBUTION-39.p5m"
MANIFEST="$DISTRIBUTION-39.p5m"
