%patch% 03-testing-verbose.patch

%hook-manifest%
# The automatically detected license file and its license is incorrect, we need
# to force better values.
LICFILE='COPYING.rst'
LICENSE='CC-PDDC AND BSD-3-Clause AND BSD-2-Clause'
gsed -i -e 's/^\(COMPONENT_LICENSE_FILE =\t*\)[^\t]*$/\1'"$LICFILE"'/' Makefile
gsed -i -e 's/^\(COMPONENT_LICENSE =\t*\)[^\t]*$/\1'"$LICENSE"'/' Makefile
git add Makefile

%include-2%
# This component is required by following bootstrapped components so it must be
# bootstrapped too.
# - tox (test bootstrap)
PYTHON_TEST_BOOTSTRAP = yes
%include-3%
# Filter out lines with timestamps
COMPONENT_TEST_TRANSFORMS += "-e '/^Testing Docutils/d'"
COMPONENT_TEST_TRANSFORMS += "-e '/^OS:/d'"
COMPONENT_TEST_TRANSFORMS += "-e '/^Elapsed time:/d'"
