%patch% 01-anyio.patch
%patch% 02-no-a2wsgi.patch
%patch% 03-no-wsproto.patch
%patch% 04-test-reqs.patch
%patch% 05-no-coverage.patch
%patch% 06-no-mypy.patch
%patch% 07-no-httptools.patch
%patch% 08-deprecation.patch

%hook-begin%
# This is the latest version with Python 3.9 support
VERSION=0.39.0

%include-2%
# uvicorn >= 0.40.0 requires Python >= 3.10
PYTHON_VERSIONS = 3.9
%include-3%
# This project does not support tox so we need to provide test requirements
# manually.
TEST_REQUIREMENTS_PEP735 += dev

# https://github.com/Kludex/uvicorn/discussions/2755#discussioncomment-14918784
PYTEST_ADDOPTS += --deselect "tests/protocols/test_websocket.py::test_send_binary_data_to_server_bigger_than_default_on_websockets[h11-max=defaults sent=defaults+1]"

# Random directory name
COMPONENT_TEST_TRANSFORMS += "-e 's|/tmp/.*/garbage[^/]*|\$$(TMPDIR)|'"
%hook-manifest%
# We need versioned package only, so we cannot have PYVER in the p5m file name
mv "$DISTRIBUTION-PYVER.p5m" "$DISTRIBUTION-39.p5m"
sed -i -e 's/\$(PYVER)/3.9/g' -e 's/\$(PYV)/39/g' "$DISTRIBUTION-39.p5m"
MANIFEST="$DISTRIBUTION-39.p5m"
