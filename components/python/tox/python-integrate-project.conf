%patch% 01-test-no-devpi_process.patch
%patch% 02-tox-pytest-indirectly.patch
%patch% 03-tox-cov-proto.patch
%patch% 04-test-tox-path.patch
%patch% 05-tox-current-env.patch
%patch% 06-no-diff-cover.patch
%patch% 07-setup.cfg.patch

%include-2%
# This component is required by following bootstrapped components so it must be
# bootstrapped too.
# - tox-current-env (test bootstrap)
# - Userland testing framework (see setup.py.mk)
PYTHON_TEST_BOOTSTRAP = yes

# Python 3.9 is not supported by tox >= 4.31.0
PYTHON_VERSIONS := $(filter-out 3.9,$(PYTHON_VERSIONS))
%include-3%
# This test fails with tox-current-env
PYTEST_ADDOPTS += --deselect tests/tox_env/python/test_python_api.py::test_build_wheel_in_non_base_pkg_env

# Random directory name
COMPONENT_TEST_TRANSFORMS += "-e 's|/tmp/.*/garbage[^/]*|\$$(TMPDIR)|'"
