%patch% 01-test-requirements.patch
%patch% 02-test-disable-failing.patch

%hook-begin%
# This is the latest version with Python 3.9 support
VERSION=5.10.2

%include-2%
# pyfakefs >= 6.0.0 requires Python >= 3.10
PYTHON_VERSIONS = 3.9
%include-3%
# Normalize pointers
COMPONENT_TEST_TRANSFORMS += "-e 's/0x[0-9a-f]\{12\}/\$$(POINTER)/g'"
# Random temporary file name
COMPONENT_TEST_TRANSFORMS += "-e 's|\(/tmp/tmp\).\{8\}|\1XXXXXXXX|'"
COMPONENT_TEST_TRANSFORMS += "-e 's/\(KeyError: '\"'\"'tmp\).\{8\}'\"'\"'/\1XXXXXXXX'\"'\"'/'"
%hook-manifest%
# We need versioned package only, so we cannot have PYVER in the p5m file name
mv "$DISTRIBUTION-PYVER.p5m" "$DISTRIBUTION-39.p5m"
sed -i -e 's/\$(PYVER)/3.9/g' -e 's/\$(PYV)/39/g' "$DISTRIBUTION-39.p5m"
MANIFEST="$DISTRIBUTION-39.p5m"
