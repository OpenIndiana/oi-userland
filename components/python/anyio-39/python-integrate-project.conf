%patch% 01-no-trio.patch
%patch% 02-no-uvloop.patch
%patch% 03-no-blockbuster.patch
%patch% 04-tcp.patch
%patch% 05-no-coverage.patch
%patch% 06-no-truststore.patch

%hook-begin%
# This is the latest version with Python 3.9 support
VERSION=4.12.1

%include-2%
# anyio >= 4.13.0 requires Python >= 3.10
PYTHON_VERSIONS = 3.9
%include-3%
# We have no trio packaged yet.
# https://github.com/python-trio/trio/issues/1437
COMPONENT_POST_UNPACK_ACTION += $(RM) $(COMPONENT_SRC)/src/anyio/_backends/_trio.py ;

# https://github.com/agronholm/anyio/issues/986
PYTEST_ADDOPTS += --deselect tests/test_sockets.py::TestTCPStream::test_unretrieved_future_exception_server_crash

# Random directory name
COMPONENT_TEST_TRANSFORMS += "-e 's|/tmp/.*/garbage[^/]*|\$$(TMPDIR)|'"
%hook-manifest%
# We need versioned package only, so we cannot have PYVER in the p5m file name
mv "$DISTRIBUTION-PYVER.p5m" "$DISTRIBUTION-39.p5m"
sed -i -e 's/\$(PYVER)/3.9/g' -e 's/\$(PYV)/39/g' "$DISTRIBUTION-39.p5m"
MANIFEST="$DISTRIBUTION-39.p5m"
