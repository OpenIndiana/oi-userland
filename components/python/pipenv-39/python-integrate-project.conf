%patch% 01-no-shebang.patch

%hook-begin%
# https://github.com/pypa/pipenv/issues/6294
DOWNLOAD_URL='https://github.com/pypa/pipenv/archive/refs/tags/v$(HUMAN_VERSION).tar.gz'

# This is the latest version with Python 3.9 support
VERSION=2025.0.4

%include-2%
# pipenv >= 2025.1.1 requires Python >= 3.10
PYTHON_VERSIONS = 3.9
%include-3%
# Remove misplaced docs and examples files
# https://github.com/pypa/pipenv/issues/5937
COMPONENT_POST_INSTALL_ACTION += \
	$(RM) -r $(PROTO_DIR)/$(PYTHON_LIB)/docs ; \
	$(RM) -r $(PROTO_DIR)/$(PYTHON_LIB)/examples ;

# https://github.com/pypa/pipenv/issues/6294#issuecomment-2537370184
PYTEST_ADDOPTS += -m "not cli and not needs_internet" tests/unit/

# This project does not support tox so we need to provide test requirements
# manually.
TEST_REQUIRED_PACKAGES.python += library/python/pytest-cov
%hook-manifest%
# We need versioned package only, so we cannot have PYVER in the p5m file name
mv "$DISTRIBUTION-PYVER.p5m" "$DISTRIBUTION-39.p5m"
sed -i -e 's/\$(PYVER)/3.9/g' -e 's/\$(PYV)/39/g' "$DISTRIBUTION-39.p5m"
MANIFEST="$DISTRIBUTION-39.p5m"
