%patch% 01-test-indirectly.patch
%patch% 02-setuptools.patch

%hook-begin%
# This is the latest version with Python 3.9 support
VERSION=8.1

%include-2%
# zope.testrunner >= 8.2 requires Python >= 3.10
PYTHON_VERSIONS = 3.9
%include-3%
# Force no colors and more verbose output via tox posargs
TOX_POSARGS += -vv

# https://github.com/zopefoundation/zope.testrunner/issues/189
TOX_POSARGS += --test !testrunner-edge-cases
# https://github.com/zopefoundation/zope.testrunner/issues/203
TOX_POSARGS += --test !testrunner-colors

# Random pid
COMPONENT_TEST_TRANSFORMS += "-e 's/\(subprocess \)[0-9]\{1,\}\( is still running\)/\1\$$(PID)\2/'"
%hook-manifest%
# The badsyntax.py file contains intentionally bad syntax so there is no .pyc file for it
printf '<transform file path=.*/badsyntax\.py$ -> set pkg.tmp.autopyc false>\n' >> "$DISTRIBUTION-PYVER.p5m"
# Do not generate dependencies on pkg_resources for usr/bin files otherwise we would end with duplicate dependencies on setuptools.
printf '<transform file path=usr/bin -> add pkg.depend.bypass-generate .*/pkg_resources.* >\n' >> "$DISTRIBUTION-PYVER.p5m"
# Do not generate dependencies for usr/bin files on zope/__init__.py.  This
# file does not exist, but pkgdepend suggests for unknown reason it is needed.
printf '<transform file path=usr/bin -> add pkg.depend.bypass-generate .*/zope/__init__\\.py >\n' >> "$DISTRIBUTION-PYVER.p5m"
# We need versioned package only, so we cannot have PYVER in the p5m file name
mv "$DISTRIBUTION-PYVER.p5m" "$DISTRIBUTION-39.p5m"
sed -i -e 's/\$(PYVER)/3.9/g' -e 's/\$(PYV)/39/g' "$DISTRIBUTION-39.p5m"
MANIFEST="$DISTRIBUTION-39.p5m"
