%patch% 01-no-coverage.patch

%hook-begin%
#
# The sdist for this project is missing tests so we need to use github tarball.
#
# This was not reported as issue upstream because reporting bugs related to
# tests in sdist or tests in general to projects maintained by asotile is
# dangerous since he could simply block you when you try to report such bugs.
#
# As of 2023-08-25 I cannot report any issue for this project because I'm still
# blocked by asotile after I reported this:
#
# https://github.com/pre-commit/pre-commit/issues/2872
#
DOWNLOAD_URL='https://github.com/asottile/ukkonen/archive/refs/tags/v$(HUMAN_VERSION).tar.gz'

# This is the latest version with Python 3.9 support
VERSION=1.0.1

%include-2%
# ukkonen >= 1.1.0 requires Python >= 3.10
PYTHON_VERSIONS = 3.9
%hook-manifest%
# We need versioned package only, so we cannot have PYVER in the p5m file name
mv "$DISTRIBUTION-PYVER.p5m" "$DISTRIBUTION-39.p5m"
sed -i -e 's/\$(PYVER)/3.9/g' -e 's/\$(PYV)/39/g' "$DISTRIBUTION-39.p5m"
MANIFEST="$DISTRIBUTION-39.p5m"
