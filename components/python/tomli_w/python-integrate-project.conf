%patch% 01-tox-pytest-indirectly.patch
%patch% 02-no-coverage.patch
%patch% 03-no-randomly.patch

%hook-begin%
# https://github.com/hukkin/tomli-w/issues/61
DOWNLOAD_URL='https://github.com/hukkin/tomli-w/archive/refs/tags/$(HUMAN_VERSION).tar.gz'

%include-2%
# This component is required by following bootstrapped components so it must be
# bootstrapped too.
# - tox (test bootstrap)
PYTHON_TEST_BOOTSTRAP = yes
%include-3%
# Random directory name
COMPONENT_TEST_TRANSFORMS += "-e 's|/tmp/.*/garbage[^/]*|\$$(TMPDIR)|'"

# Test results order varies between runs
PYTEST_SORT_TESTS = yes
