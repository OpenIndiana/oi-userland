%patch% 01-illumos-load-libgl.patch
%patch% 02-no-shebang.patch

%include-2%
# The tests need an OpenGL display (GLUT, EGL, pygame)
TEST_STYLE = none

%hook-manifest%
# OpenGL/DLLS holds Windows libraries (freeglut, gle), of no use here
gsed -i -e "/vendor-packages\/OpenGL\/DLLS\//d" "$MANIFEST"
