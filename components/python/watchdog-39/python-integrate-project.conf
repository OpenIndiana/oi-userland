%patch% 01-no-eventlet.patch
%patch% 02-no-ruff.patch
%patch% 03-no-coverage.patch
%patch% 04-no-typing.patch
%patch% 05-no-pytest-timeout.patch
%patch% 06-no-sphinx.patch

%hook-begin%
# This is the latest version with Python 3.9 support
VERSION=6.0.0

%include-2%
# watchdog >= 7.0.0 requires Python >= 3.11
PYTHON_VERSIONS = 3.9
%include-3%
# https://github.com/gorakhargosh/watchdog/issues/10
PYTEST_ADDOPTS += --ignore=tests/test_emitter.py

# https://github.com/gorakhargosh/watchdog/issues/973
PYTEST_ADDOPTS += --deselect tests/test_0_watchmedo.py::test_auto_restart_on_file_change_debounce
%hook-manifest%
# We need versioned package only, so we cannot have PYVER in the p5m file name
mv "$DISTRIBUTION-PYVER.p5m" "$DISTRIBUTION-39.p5m"
sed -i -e 's/\$(PYVER)/3.9/g' -e 's/\$(PYV)/39/g' "$DISTRIBUTION-39.p5m"
MANIFEST="$DISTRIBUTION-39.p5m"
