%patch% 01-test-deps.patch

%include-2%
# This component is required by following bootstrapped components so it must be
# bootstrapped too.
# - build
# - hatchling (test bootstrap)
# - pyproject_api (test bootstrap)
# - pytest (test bootstrap)
# - setuptools-scm
# - tox (test bootstrap)
# - wheel (test bootstrap)
# - Userland build framework (see setup.py.mk)
PYTHON_BOOTSTRAP = yes
%include-3%
# This project does not support tox so we need to provide test requirements
# manually.
TEST_REQUIREMENTS_PEP735 += test

# Test results order varies between runs
PYTEST_SORT_TESTS = yes
%hook-manifest%
# Only LICENSE.APACHE is used automatically, but we need LICENSE and LICENSE.BSD too.
(
	cat "$SOURCE_DIR/LICENSE"
	printf '\n--- LICENSE.APACHE --------------------------------------------------------\n\n'
	cat "$SOURCE_DIR/LICENSE.APACHE"
	printf '\n--- LICENSE.BSD -----------------------------------------------------------\n\n'
	cat "$SOURCE_DIR/LICENSE.BSD"
) > "$DISTRIBUTION.license"
sed -i -e '/^COMPONENT_LICENSE_FILE/d' Makefile
git add "$DISTRIBUTION.license"
LICENSE=
detect_license LICENSE "$DISTRIBUTION.license"
gsed -i -e 's/^\(COMPONENT_LICENSE =\t*\)[^\t]*$/\1'"$LICENSE"'/' Makefile
git add Makefile
